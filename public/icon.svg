<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Helmet gradient -->
    <linearGradient id="helmetGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Earphone gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle rounded background for PWA icon -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)"/>

  <!-- ROBOT MASCOT -->
  <g transform="translate(256, 260)">
    <!-- Back part of planetary ring -->
    <path d="M -150 -10 C -180 40, -160 110, -75 145 C -35 162, 30 160, 105 125 C 170 92, 210 32, 195 -20 C 180 -35, 165 -30, 150 -15" 
          fill="none" stroke="url(#ringGrad)" stroke-width="36" stroke-linecap="round" opacity="0.9" />

    <!-- Left Earphone -->
    <g transform="translate(-135, -5)">
      <rect x="-16" y="-40" width="32" height="80" rx="16" fill="url(#earGrad)" filter="url(#softShadow)"/>
      <ellipse cx="-4" cy="0" rx="7" ry="20" fill="#6366f1" opacity="0.8"/>
    </g>

    <!-- Right Earphone -->
    <g transform="translate(135, -5)">
      <rect x="-16" y="-40" width="32" height="80" rx="16" fill="url(#earGrad)" filter="url(#softShadow)"/>
      <ellipse cx="4" cy="0" rx="7" ry="20" fill="#a855f7" opacity="0.8"/>
    </g>

    <!-- Helmet Body -->
    <circle cx="0" cy="0" r="130" fill="url(#helmetGrad)" filter="url(#softShadow)"/>
    <path d="M -105 -55 C -75 -115, 35 -125, 95 -75 C 65 -105, -35 -110, -85 -45 Z" fill="#ffffff" opacity="0.75"/>

    <!-- Visor -->
    <rect x="-96" y="-56" width="192" height="112" rx="54" fill="#0f172a" filter="url(#softShadow)"/>

    <!-- Smiling Eyes -->
    <path d="M -58 -2 C -48 -16, -30 -16, -20 -2" fill="none" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round"/>
    <path d="M 20 -2 C 30 -16, 48 -16, 58 -2" fill="none" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round"/>

    <!-- Front part of planetary ring -->
    <path d="M -140 18 C -110 105, -20 148, 60 125 C 120 108, 172 65, 192 14 C 200 -8, 195 -22, 182 -26 C 172 -26, 162 -18, 156 0 C 135 40, 95 78, 42 94 C -12 110, -78 82, -115 22 Z" 
          fill="url(#ringGrad)"/>

    <!-- Sparkle Star in Top-Right -->
    <g transform="translate(120, -118)" filter="url(#starGlow)">
      <path d="M 0 -26 Q 0 0, 26 0 Q 0 0, 0 26 Q 0 0, -26 0 Q 0 0, 0 -26 Z" fill="#a855f7"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
