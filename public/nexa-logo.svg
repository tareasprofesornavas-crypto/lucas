<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle clean studio glow) -->
    <radialGradient id="studioGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Helmet outer body gradient (pearly metallic white with lavender ambient) -->
    <linearGradient id="helmetGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Earphone gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- X Gradient -->
    <linearGradient id="xGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="xGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Soft 3D drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c084fc" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Clean canvas -->
  <rect width="800" height="800" rx="40" fill="url(#studioGlow)"/>

  <!-- ROBOT MASCOT GROUP -->
  <g transform="translate(400, 270)">
    <!-- Back part of planetary ring (behind helmet) -->
    <path d="M -160 -10 C -190 40, -170 110, -80 150 C -40 168, 30 165, 110 130 C 180 95, 220 35, 205 -20 C 190 -35, 175 -30, 160 -15" 
          fill="none" stroke="url(#ringGrad)" stroke-width="38" stroke-linecap="round" opacity="0.9" />

    <!-- Left Earphone -->
    <g transform="translate(-142, -5)">
      <rect x="-18" y="-45" width="36" height="90" rx="18" fill="url(#earGrad)" filter="url(#softShadow)"/>
      <ellipse cx="-4" cy="0" rx="8" ry="24" fill="#6366f1" opacity="0.8"/>
    </g>

    <!-- Right Earphone -->
    <g transform="translate(142, -5)">
      <rect x="-18" y="-45" width="36" height="90" rx="18" fill="url(#earGrad)" filter="url(#softShadow)"/>
      <ellipse cx="4" cy="0" rx="8" ry="24" fill="#a855f7" opacity="0.8"/>
    </g>

    <!-- Main Helmet Body -->
    <circle cx="0" cy="0" r="140" fill="url(#helmetGrad)" filter="url(#softShadow)"/>

    <!-- Helmet glossy rim reflection -->
    <path d="M -115 -60 C -80 -125, 40 -135, 105 -80 C 70 -115, -40 -120, -95 -50 Z" fill="#ffffff" opacity="0.7"/>

    <!-- Visor (Dark curved display) -->
    <rect x="-105" y="-62" width="210" height="124" rx="60" fill="#0f172a" filter="url(#softShadow)"/>

    <!-- Visor interior depth shine -->
    <ellipse cx="-40" cy="-35" rx="35" ry="12" fill="#ffffff" opacity="0.12"/>

    <!-- Smiling Eyes (Happy inverted arcs) -->
    <path d="M -64 -2 C -54 -18, -32 -18, -22 -2" fill="none" stroke="#a5b4fc" stroke-width="13" stroke-linecap="round"/>
    <path d="M 22 -2 C 32 -18, 54 -18, 64 -2" fill="none" stroke="#a5b4fc" stroke-width="13" stroke-linecap="round"/>

    <!-- Front part of planetary ring (looping in front of helmet lower jaw) -->
    <path d="M -150 20 C -120 115, -20 160, 65 135 C 130 115, 185 70, 205 15 C 215 -10, 210 -25, 195 -30 C 185 -30, 175 -20, 168 0 C 145 45, 100 85, 45 102 C -15 120, -85 90, -125 25 Z" 
          fill="url(#ringGrad)"/>

    <!-- Sparkle Star in Top-Right -->
    <g transform="translate(130, -125)" filter="url(#starGlow)">
      <path d="M 0 -28 Q 0 0, 28 0 Q 0 0, 0 28 Q 0 0, -28 0 Q 0 0, 0 -28 Z" fill="#a855f7"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- TYPOGRAPHY: NEXA -->
  <g transform="translate(400, 560)">
    <!-- 'N' -->
    <path d="M -245 40 L -245 -70 L -205 -70 L -140 0 L -140 -70 L -105 -70 L -105 40 L -145 40 L -210 -30 L -210 40 Z" fill="#0f172a"/>

    <!-- 'e' -->
    <g transform="translate(-40, 0)">
      <path d="M -45 -15 C -45 -52, -15 -74, 25 -74 C 65 -74, 92 -48, 92 -10 L 92 -3 L -10 -3 C -7 18, 8 26, 28 26 C 45 26, 58 18, 65 8 L 90 24 C 75 44, 55 54, 24 54 C -20 54, -45 22, -45 -15 Z M 57 -25 C 55 -40, 42 -52, 25 -52 C 8 -52, -4 -40, -8 -25 Z" fill="#0f172a"/>
    </g>

    <!-- 'x' (Stylized purple gradient translucent cross) -->
    <g transform="translate(75, -10)">
      <!-- First bar -->
      <path d="M -48 -60 L 48 50" stroke="url(#xGrad1)" stroke-width="36" stroke-linecap="round"/>
      <!-- Second bar -->
      <path d="M 48 -60 L -48 50" stroke="url(#xGrad2)" stroke-width="36" stroke-linecap="round" opacity="0.88"/>
      <!-- Glowing nexus center -->
      <circle cx="0" cy="-5" r="14" fill="#c084fc" opacity="0.6"/>
    </g>

    <!-- 'a' -->
    <g transform="translate(195, 0)">
      <path d="M -15 40 C -45 40, -65 24, -65 -2 C -65 -28, -42 -42, -5 -42 C 12 -42, 24 -38, 32 -34 L 32 -42 C 32 -54, 20 -60, 2 -60 C -12 -60, -25 -55, -34 -48 L -45 -68 C -30 -80, -8 -86, 8 -86 C 44 -86, 68 -68, 68 -32 L 68 40 L 34 40 L 34 26 C 24 35, 8 40, -15 40 Z M 32 -10 C 24 -16, 12 -20, -2 -20 C -18 -20, -30 -12, -30 0 C -30 12, -18 18, -4 18 C 16 18, 32 6, 32 -10 Z" fill="#0f172a"/>
    </g>
  </g>

  <!-- TAGLINE: Tu aliada en la productividad -->
  <text x="400" y="650" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="600" 
        letter-spacing="4.5" 
        fill="#475569">
    Tu aliada en la productividad
  </text>
</svg>
